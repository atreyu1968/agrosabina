<script>
/* Red de seguridad. Si el navegador no deja arrancar el programa (por ejemplo
   porque el archivo se abrió con doble clic desde el disco y los módulos
   quedan bloqueados), avisamos con un mensaje claro en vez de dejar la
   pantalla vacía. Cuando todo va bien, no se ve nada de esto. */
window.setTimeout(function () {
  if (window.__appBooted) return;
  var sub = document.getElementById("viewSub");
  if (sub) sub.textContent = "No he podido arrancar";
  var view = document.getElementById("view");
  if (!view) return;
  view.innerHTML =
    '<div class="card"><div class="card-body">' +
    "<h2>No he podido arrancar la aplicación</h2>" +
    "<p>Este navegador ha bloqueado el programa. Pasa cuando el archivo se abre con doble clic desde el disco: por seguridad, el navegador no deja cargar el código así.</p>" +
    "<p><strong>Ábrela desde la vista previa de la aplicación</strong> (o desde cualquier servidor web), no con doble clic en el archivo. Tus datos siguen guardados en este navegador.</p>" +
    '<p><button class="btn" onclick="location.reload()">Reintentar</button></p>' +
    "</div></div>";
}, 2500);
</script>
<noscript>
  <p style="padding:24px">Para usar esta aplicación, activa JavaScript en el navegador.</p>
</noscript>
